# Type-check every PR and every push to main. The Release workflow reuses this
# job, so nothing reaches production without passing it.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Prisma's CLI reads this from prisma.config.ts; no database is opened.
      DATABASE_URL: file:./prisma/ci.db
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx tsc --noEmit
